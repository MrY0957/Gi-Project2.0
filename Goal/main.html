<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Master Roadmap</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#1e3a8a;
}

.section{
    background:white;
    margin:15px 0;
    padding:15px 20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.section h2{
    color:#2563eb;
}

label{
    display:block;
    padding:5px;
    cursor:pointer;
}

input[type="checkbox"]{
    margin-right:8px;
}

.progress-container{
    background:#ddd;
    border-radius:30px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:25px;
    width:0%;
    background:#22c55e;
    text-align:center;
    color:white;
    font-weight:bold;
    line-height:25px;
}
</style>
</head>

<label><input type="checkbox" class="task">Next.js</label>

<label><input type="checkbox" class="task">Java</label>
<label><input type="checkbox" class="task">C</label>
<label><input type="checkbox" class="task">C++</label>
<label><input type="checkbox" class="task">C#</label>

</div>

</div>

<script>
const tasks=document.querySelectorAll('.task');
const progressBar=document.getElementById('progressBar');

function updateProgress(){
    const checked=document.querySelectorAll('.task:checked').length;
    const total=tasks.length;
    const percent=Math.round((checked/total)*100);

    progressBar.style.width=percent+'%';
    progressBar.innerText=percent+'%';

    localStorage.setItem('roadmapProgress',JSON.stringify(
        [...tasks].map(task=>task.checked)
    ));
}

const saved=JSON.parse(localStorage.getItem('roadmapProgress'));

if(saved){
    tasks.forEach((task,index)=>{
        task.checked=saved[index];
    });
}

tasks.forEach(task=>{
    task.addEventListener('change',updateProgress);
});

updateProgress();
</script>

</body>
